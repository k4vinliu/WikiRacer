services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - agent

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "speedrun.server", "--host", "0.0.0.0", "--port", "8848", "--allow-origin", "*"]
    expose:
      - "8848"
    env_file:
      - .env
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_EASY_MODEL: ${LLM_EASY_MODEL}
      LLM_MEDIUM_MODEL: ${LLM_MEDIUM_MODEL}
      LLM_HARD_MODEL: ${LLM_HARD_MODEL}
      STEEL_API_KEY: ${STEEL_API_KEY}
