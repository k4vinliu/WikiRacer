# Render blueprint for the agent server. Point Render at this repo and it reads
# this file; nothing here needs Docker installed locally, Render builds remotely.
#
# Why Render and not Vercel: this is a STATEFUL, long-lived process. server.py
# holds the RaceManager, the EventLog, the Steel session and the `go` event in
# process memory, and POST /race -> GET /events -> POST /race/<id>/go are three
# separate requests that must share them. Serverless breaks that outright.
services:
  - type: web
    name: wikiracer-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health

    # EXACTLY ONE INSTANCE, and this is not a cost decision. Two instances would
    # load-balance the three requests of a single race across two processes that
    # share no memory, so /events would stream from a process that has never
    # heard of the race POST /race created.
    numInstances: 1

    envVars:
      # sync:false = "prompt me, don't store it in git". Never commit these.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The Steel CLI reads this itself; our code never does (PLAN.md §4.E).
      # Verified: `steel doctor` reports source "env (STEEL_API_KEY)" and passes
      # with no login config file present.
      - key: STEEL_API_KEY
        sync: false
      # The Vercel page's origin, comma-separated for more than one. Without it
      # the browser is refused with 403 (verified locally).
      - key: ALLOW_ORIGIN
        sync: false
